[package]
name = "factory_installer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.0"
bincode = "1.0.1"
byteorder = "1.4.3"
clap = { version = "3.1.0", features = ["derive"] }
glob = "0.3.0"
hmac-sha256 = "0.1.7"
lazy_static = "1.4.0"
libc = "0.2.0"
nix = "0.23.0"
num-traits = "0.2.12"
num-derive = "0.3.3"
regex = "1.0.0"
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
tempfile = "3.2.0"
thiserror = "1.0.50"
qrcode = "0.13.0"
image = { version = "0.24.8", default-features = false }
png = "0.16.8"
hyper = { version = "0.14.27", features = ["full"]}
tokio = { version = "1", features = ["full"]}
futures = "0.3.28"
console = "0.15.7"

[dev-dependencies]
mockall = "0.12.1"

[features]
default = ["factory-ufs", "factory-installer"]
factory-ufs = []
factory-installer = []
cq-test = []
