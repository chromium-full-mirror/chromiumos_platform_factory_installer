[package]
name = "factory_installer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.0"
bincode = "1.0.1"
clap = { version = "3.1.0", features = ["derive"] }
glob = "0.3.0"
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
tempfile = "3.2.0"

[features]
default = ["factory-fai", "factory-ufs"]
factory-fai = []
factory-ufs = []
