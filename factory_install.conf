# description "Factory installer service"
# author "chromium-os-dev@googlegroups.com"
#
# when boot has finished, start up factory installer.

start on started system-services

# Use setsid to ensure that the script has the controlling terminal.
script
  # Determine the right console by following order:
  #  - The last non-empty console= from cmdline.
  #  - Frecon if frecon is working fine.
  #  - /dev/tty1 if available (for Non-Freon boards).
  #  - /dev/null no any console available.

  is_valid_tty() {
    [ -c "$1" ] && (echo "" >"$1") 2>/dev/null
  }

  TTY=""

  entry="$(cat /proc/cmdline)"
  ttys=""
  while echo "${entry}" | grep -q console= ; do
    entry="${entry#*console=}"
    ttys="${entry%%[ ,]*} ${ttys}"
    entry="${entry#* }"
  done

  for tty in ${ttys}; do
    if is_valid_tty "/dev/${tty}"; then
      TTY="${tty}"
      break
    fi
  done

  # TODO(hungte) Check and enable Frecon.

  if [ -z "${TTY}" ] && is_valid_tty "/dev/tty1"; then
    TTY=/dev/tty1
  fi

  if [ -z "${TTY}" ]; then
    TTY=/dev/null
  fi

  exec setsid sh -c \
    "exec /usr/sbin/factory_install.sh <${TTY} >${TTY} 2>&1"
end script
