- key: "ap_write_protect.status"
  pattern: "enabled"
  type: "match"
- key: "ec_write_protect.flags"
  pattern: ".*(ro_now|all_now).*"
  type: "match"
- key: "ro_vpd"
  pattern: "attested_device_id"
  type: "include"
- key: "ro_vpd"
  pattern: "region"
  type: "include"
- key: "ro_vpd"
  pattern: "region"
  type: "include"
- key: "gsc_capabilities.STATE"
  pattern: "Locked"
  type: "include"
- key: "gsc_capabilities.ALLOW_UNVERIFIED_RO"
  pattern: "N"
  type: "match"
- key: "release_image_stateful_partition"
  pattern: "dev_image/*"
  type: "exclude"
- key: "crossystem.wpsw_cur"
  pattern: "1"
  type: "match"
- key: "release_image_info.CHROMEOS_RELEASE_KEYSET"
  pattern: "mp-v\\d+"
  type: "match"
- key: "release_image_info.CHROMEOS_RELEASE_TRACK"
  pattern: "stable-channel"
  type: "match"
- key: "gsc_board_id.BID_RLZ"
  pattern: "^(?!ZZCR).*"
  type: "match"
- key: "tpm_status.Endorsement password set"
  pattern: "${tpm_status.Ownership status}"
  type: "match"
- key: "tpm_status.Lockout password set"
  pattern: "${tpm_status.Ownership status}"
  type: "match"
- key: "tpm_status.Owner password set"
  pattern: "${tpm_status.Ownership status}"
  type: "match"
